<section class="stats" aria-label="Indicadores principales">
  <div class="stat"><span class="stat-value" id="latest-ratio">{{RATIO}}<i>%</i></span><span class="stat-label">Deuda sobre el PIB · {{YEAR}}</span><span class="stat-change" id="ratio-change">{{RATIO_CHANGE}} pp interanual</span></div>
  <div class="stat"><span class="stat-value" id="latest-debt">{{DEBT}}<i> bill. €</i></span><span class="stat-label">Deuda consolidada · {{YEAR}}</span><span class="stat-change down" id="debt-change">{{DEBT_CHANGE}}% interanual</span></div>
  <div class="stat"><span class="stat-value" id="spending-gdp">{{SPENDING_GDP}}<i>%</i></span><span class="stat-label">Gasto público sobre el PIB</span><span class="stat-change">{{SPENDING_YEAR}} · {{SPENDING_STATUS}}</span></div>
  <div class="stat"><span class="stat-value" id="social-share">{{SOCIAL_SHARE}}<i>%</i></span><span class="stat-label">En protección social</span><span class="stat-change">del gasto total · {{SPENDING_YEAR}}</span></div>
</section>
